<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="450" viewBox="0 0 1920 450">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#0d1222"/>
      <stop offset="0.55" stop-color="#121a33"/>
      <stop offset="1" stop-color="#1b2442"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1920" height="450" fill="url(#bg)"/>
  <!-- the ring on the right half -->
  <ellipse cx="1400" cy="270" rx="430" ry="170" fill="#1b2442"/>
  <ellipse cx="1400" cy="270" rx="300" ry="118" fill="none" stroke="#5ad1ff" stroke-opacity="0.14" stroke-width="4"/>
  <ellipse cx="1400" cy="270" rx="170" ry="66" fill="none" stroke="#5ad1ff" stroke-opacity="0.14" stroke-width="4"/>
  <ellipse cx="1400" cy="270" rx="430" ry="170" fill="none" stroke="#ff6b8a" stroke-width="10" filter="url(#glow)"/>
  <!-- pucks: two on the ring, one flying off the edge -->
  <g filter="url(#glow)">
    <ellipse cx="1330" cy="260" rx="70" ry="46" fill="#0d1222" stroke="#ffb547" stroke-width="14"/>
    <ellipse cx="1520" cy="300" rx="70" ry="46" fill="#0d1222" stroke="#7dff8a" stroke-width="14"/>
    <ellipse cx="1840" cy="120" rx="60" ry="40" fill="#0d1222" stroke="#5ad1ff" stroke-width="12" transform="rotate(-18 1840 120)"/>
  </g>
  <text x="1330" y="276" text-anchor="middle" font-family="Bungee" font-size="40" fill="#ffb547">1</text>
  <text x="1520" y="316" text-anchor="middle" font-family="Bungee" font-size="40" fill="#7dff8a">4</text>
  <text x="1840" y="134" text-anchor="middle" font-family="Bungee" font-size="34" fill="#5ad1ff">2</text>
  <!-- the knock-off streak -->
  <g stroke="#5ad1ff" stroke-width="10" stroke-linecap="round" opacity="0.6">
    <line x1="1660" y1="190" x2="1760" y2="150"/>
    <line x1="1680" y1="215" x2="1770" y2="180"/>
  </g>
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="1650" cy="205" r="7"/>
    <circle cx="1625" cy="180" r="5"/>
    <circle cx="1675" cy="235" r="5"/>
  </g>
</svg>
