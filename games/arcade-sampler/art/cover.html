<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Arcade Sampler cover</title>
    <style>
      @font-face { font-family: 'Lilita One'; src: url('../assets/fonts/lilita-one.woff2') format('woff2'); }
      html, body { margin: 0; width: 720px; height: 500px; overflow: hidden; background: #140f2e; }
      canvas { position: absolute; inset: 0; width: 720px; height: 500px; }
      h1 { position: absolute; left: 0; right: 0; margin: 0; text-align: center; font: 92px/0.95 'Lilita One', sans-serif; letter-spacing: 1px; }
      .edge { color: #0a0718; -webkit-text-stroke: 18px #0a0718; }
      .fill { background: linear-gradient(#ffffff, #ffd8e6); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .fill span, .edge span { display: block; }
      .fill span { background: linear-gradient(#ffe48a, #ffd23f 55%, #f0a91c); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .top { top: 16px; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1440" height="1000"></canvas>
    <h1 class="edge top">ARCADE<span>SAMPLER</span></h1>
    <h1 class="fill top">ARCADE<span>SAMPLER</span></h1>
    <script type="module">
      import { drawScene } from './scene.js'
      drawScene(document.getElementById('c'), 720, 500, { cx: 360, cy: 286, cw: 146 })
    </script>
  </body>
</html>
