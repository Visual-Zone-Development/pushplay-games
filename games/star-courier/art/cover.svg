<svg xmlns="http://www.w3.org/2000/svg" width="720" height="500" viewBox="0 0 720 500">
  <rect width="720" height="500" fill="#0b1024"/>
  <!-- star field -->
  <g fill="#ffffff">
    <circle cx="60" cy="40" r="2" opacity=".8"/><circle cx="150" cy="120" r="1.5" opacity=".6"/>
    <circle cx="240" cy="60" r="2.5"/><circle cx="330" cy="150" r="1.5" opacity=".5"/>
    <circle cx="420" cy="30" r="2" opacity=".7"/><circle cx="520" cy="90" r="1.5" opacity=".6"/>
    <circle cx="640" cy="50" r="2.5"/><circle cx="690" cy="170" r="1.5" opacity=".5"/>
    <circle cx="90" cy="220" r="1.5" opacity=".6"/><circle cx="600" cy="250" r="2" opacity=".7"/>
    <circle cx="40" cy="300" r="2" opacity=".5"/><circle cx="680" cy="330" r="1.5" opacity=".6"/>
  </g>
  <!-- planet -->
  <circle cx="610" cy="120" r="150" fill="#2e5bff"/>
  <circle cx="660" cy="80" r="150" fill="#0b1024" opacity=".35"/>
  <!-- asteroids -->
  <polygon points="120,180 150,165 175,185 170,215 140,228 115,210" fill="#6d6a80"/>
  <polygon points="520,300 545,292 560,312 548,334 525,336 512,318" fill="#6d6a80"/>
  <!-- parcels -->
  <g transform="translate(395 205) rotate(-12)">
    <rect x="-26" y="-22" width="52" height="44" rx="4" fill="#ffb547"/>
    <rect x="-5" y="-22" width="10" height="44" fill="#7a4a10"/>
  </g>
  <g transform="translate(250 120) rotate(18)">
    <rect x="-16" y="-14" width="32" height="28" rx="3" fill="#ffb547"/>
    <rect x="-3" y="-14" width="6" height="28" fill="#7a4a10"/>
  </g>
  <!-- ship with thrust trail -->
  <g transform="translate(360 190) rotate(-28)">
    <path d="M-150 0 L-40 -10 L-40 10 Z" fill="#ffb547" opacity=".55"/>
    <path d="M-70 0 L-26 -9 L-26 9 Z" fill="#ffe2a8"/>
    <path d="M60 0 L-36 -36 L-20 0 L-36 36 Z" fill="#5cc8ff"/>
    <path d="M18 -8 L-6 -16 L-2 0 L-6 16 L18 8 Z" fill="#dff5ff" opacity=".9"/>
  </g>
  <!-- title: kept above the bottom 110px, where the launcher draws badges -->
  <text x="40" y="300" font-family="Rubik" font-weight="900" font-size="90" letter-spacing="-1" fill="#ffffff">STAR</text>
  <text x="40" y="355" font-family="Bungee" font-weight="400" font-size="50" letter-spacing="4" fill="#ffb547">COURIER</text>
</svg>
