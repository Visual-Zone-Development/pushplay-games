<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Star Courier gallery</title>
    <style>
      html, body { margin: 0; width: 1280px; height: 800px; overflow: hidden; background: #1b2140; font: 700 16px system-ui, sans-serif; color: #c9cfdb; }
      canvas { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <!-- Contact sheet: every object at game size and enlarged, on dark and light ground. Not shipped in the game. -->
    <canvas id="c" width="2560" height="1600" style="width:1280px;height:800px"></canvas>
    <script type="module">
      import { bake, blit, bakeShip, bakeRocks, bakeParcel, drawBackdrop, drawRock, drawShipScene, drawParcelScene, drawPlanet } from '../art.js'
      const g = document.getElementById('c').getContext('2d')
      g.scale(2, 2)
      const label = (t, x, y) => { g.fillStyle = '#c9cfdb'; g.font = '700 16px system-ui'; g.fillText(t, x, y) }
      // top band: game backdrop with objects at game size, so we judge them in context
      g.save(); g.beginPath(); g.rect(0, 0, 1280, 400); g.clip()
      drawBackdrop(g, 1280, 800)
      g.restore()
      const ship = bakeShip(), parcel = bakeParcel(), rocks = bakeRocks(6)
      label('In game, 1×', 24, 30)
      blit(g, ship, 120, 120, 0); blit(g, ship, 220, 120, -0.8); blit(g, ship, 320, 120, Math.PI / 2)
      blit(g, parcel, 440, 120)
      rocks.forEach((r, i) => drawRock(g, r, 560 + i * 110, 120, 22 + (i % 3) * 11, i))
      label('At 44 px (handheld readability)', 24, 230)
      blit(g, ship, 80, 300, -0.5, 0.6); blit(g, parcel, 160, 300, 0, 0.8)
      rocks.slice(0, 3).forEach((r, i) => drawRock(g, r, 250 + i * 70, 300, 18, i))
      // bottom band: enlarged on a light ground, to check shapes and edges
      g.fillStyle = '#8a93b0'; g.fillRect(0, 400, 1280, 400)
      label('Enlarged on light ground', 24, 430)
      drawShipScene(g, 260, 600, -0.3, 4, { burn: 0.9, trail: 0.6 })
      drawParcelScene(g, 560, 600, 3)
      drawRock(g, rocks[0], 780, 600, 90, 0.5)
      drawPlanet(g, 1080, 600, 120)
    </script>
  </body>
</html>
