<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Star Courier cover</title>
    <style>
      @font-face { font-family: 'Lilita One'; src: url('../assets/fonts/lilita-one.woff2') format('woff2'); }
      html, body { margin: 0; width: 720px; height: 500px; overflow: hidden; background: #0b1024; }
      canvas { position: absolute; inset: 0; }
      .title { position: absolute; left: 34px; top: 26px; margin: 0; font: 112px/0.86 'Lilita One', sans-serif; letter-spacing: 1px; }
      .title span { display: block; }
      .title .b { font-size: 84px; }
      .fill span { background: linear-gradient(#ffffff, #d2f3ff 70%, #8fdcff); -webkit-background-clip: text; background-clip: text; color: transparent; }
      .fill .b { background: linear-gradient(#ffe4a8, #ffb547 60%, #ff9a3c); -webkit-background-clip: text; background-clip: text; }
      .edge { color: #070a18; -webkit-text-stroke: 18px #070a18; }
    </style>
  </head>
  <body>
    <canvas id="c" width="1440" height="1000" style="width:720px;height:500px"></canvas>
    <h1 class="title edge"><span>STAR</span><span class="b">COURIER</span></h1>
    <h1 class="title fill"><span>STAR</span><span class="b">COURIER</span></h1>
    <script type="module">
      import { bakeRocks, drawBackdrop, drawPlanet, drawRock, drawShipScene, drawParcelScene, drawVignette } from '../art.js'
      const W = 720, H = 500
      const g = document.getElementById('c').getContext('2d')
      g.scale(2, 2)
      drawBackdrop(g, W, H, { seed: 3, planet: false })
      drawPlanet(g, 640, 96, 150)
      const rocks = bakeRocks(6, 21)
      drawRock(g, rocks[0], 96, 330, 54, 0.4)
      drawRock(g, rocks[3], 250, 380, 26, 1.2)
      drawRock(g, rocks[1], 676, 352, 40, 2.1)
      drawRock(g, rocks[4], 420, 92, 20, 0.2)
      drawParcelScene(g, 622, 228, 1.6, 0.12)
      drawParcelScene(g, 196, 236, 1.05, -0.1)
      drawShipScene(g, 474, 262, -0.42, 3.1, { burn: 1, trail: 1.1 })
      drawVignette(g, W, H, 0.45)
    </script>
  </body>
</html>
