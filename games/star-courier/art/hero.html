<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Star Courier hero</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 450px; overflow: hidden; background: #0b1024; }
      canvas { position: absolute; inset: 0; }
    </style>
  </head>
  <body>
    <canvas id="c" width="3840" height="900" style="width:1920px;height:450px"></canvas>
    <script type="module">
      import { bakeRocks, drawBackdrop, drawPlanet, drawRock, drawShipScene, drawParcelScene } from '../art.js'
      const W = 1920, H = 450
      const g = document.getElementById('c').getContext('2d')
      g.scale(2, 2)
      drawBackdrop(g, W, H, { seed: 9, planet: false })
      drawPlanet(g, 1760, 215, 160)
      const rocks = bakeRocks(6, 33)
      drawRock(g, rocks[0], 1080, 120, 44, 0.3)
      drawRock(g, rocks[2], 1220, 380, 58, 1.4)
      drawRock(g, rocks[5], 1650, 405, 30, 2.6)
      drawRock(g, rocks[1], 1880, 330, 50, 0.9)
      drawRock(g, rocks[3], 960, 300, 22, 0.1)
      drawParcelScene(g, 1530, 330, 1.4, 0.1)
      drawParcelScene(g, 1110, 205, 1, -0.15)
      drawShipScene(g, 1330, 225, -0.2, 3.2, { burn: 1, trail: 1.6 })
      // keep the left calm and dark for the launcher's title
      const fade = g.createLinearGradient(0, 0, 900, 0)
      fade.addColorStop(0, 'rgba(5,7,15,0.65)')
      fade.addColorStop(1, 'rgba(5,7,15,0)')
      g.fillStyle = fade
      g.fillRect(0, 0, 900, H)
    </script>
  </body>
</html>
