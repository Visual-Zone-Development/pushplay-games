<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Motion Lab hero</title>
    <style>
      html, body { margin: 0; width: 1920px; height: 450px; overflow: hidden; background: #0f1630; }
      canvas { position: absolute; inset: 0; width: 1920px; height: 450px; }
      .fade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(6,9,24,0.7), rgba(6,9,24,0) 50%); }
    </style>
  </head>
  <body>
    <canvas id="c" width="3840" height="900"></canvas>
    <div class="fade"></div>
    <script type="module">
      import { drawScene } from './scene.js'
      drawScene(document.getElementById('c'), 1920, 450, { px: 1450, py: 262, k: 0.78 })
    </script>
  </body>
</html>
