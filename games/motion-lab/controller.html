<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <!-- Motion Lab's phone screen: the phone is a motion controller. createPhoneMotion() reads
         every sensor event and sends held input to the TV (controller.input { tb, tg, ta, u, gx,
         gy, m, f, st, still, ph }: tilt, "up", gyro totals, strength, the button, motion state,
         stillness and sensor stats). It detects swings and shakes here at the full sensor rate and
         sends each with its moment on this phone's clock (controller.send { swing: { dir, p, m, pt } });
         the TV's pings carry the clock check back. A swing meter shows strength against the
         threshold. Without motion sensors (plain http, a desktop browser, permission denied) it
         becomes a touch pad. -->
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; height: 100%; background: #0f1630; color: #eef2ff; font: 18px/1.35 system-ui, sans-serif; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none; }
      body { background-image: linear-gradient(#1a2550 2px, transparent 2px), linear-gradient(90deg, #1a2550 2px, transparent 2px); background-size: 32px 32px; }
      main { position: absolute; inset: 0; display: flex; flex-direction: column; gap: 12px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom, 0px)); max-width: 560px; margin: 0 auto; }
      main.ask { padding-bottom: 110px; }
      .bar { display: flex; align-items: center; gap: 10px; font-weight: 700; }
      .dot { width: 18px; height: 18px; border-radius: 50%; border: 3px solid #0a0f22; flex: none; }
      .chip { margin-left: auto; padding: 6px 12px; border-radius: 999px; background: #18224a; border: 3px solid #0a0f22; font-size: 15px; white-space: nowrap; }
      .chip.on { background: #b6f04a; color: #0a0f22; }
      .chip.warn { background: #ffd23f; color: #0a0f22; }
      .chip.bad { background: #ff5c8a; color: #0a0f22; }
      .card { background: #18224a; border: 4px solid #0a0f22; border-radius: 20px; padding: 14px 16px; }
      h1 { margin: 0; font-size: 28px; line-height: 1.1; }
      .hint { margin: 6px 0 0; color: #9aa6d6; font-weight: 600; }
      .stage { flex: 1; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; }
      canvas#level { width: min(170px, 20vh); aspect-ratio: 1; flex: none; }
      button { font: inherit; font-weight: 800; border: 4px solid #0a0f22; border-radius: 18px; color: #0a0f22; background: #2ad1c9; padding: 14px 18px; min-height: 60px; }
      button:active { transform: translateY(2px); filter: brightness(0.9); }
      #big { flex: none; width: min(74vw, 44vh, 320px); aspect-ratio: 1; border-radius: 50%; font-size: 44px; background: #ff8a3d; border-width: 6px; box-shadow: 0 10px 0 #0a0f22; }
      #big.down { transform: translateY(8px); box-shadow: 0 2px 0 #0a0f22; background: #ffd23f; }
      .row { display: flex; gap: 12px; }
      .row button { flex: 1; }
      #take { background: #ffd23f; font-size: 24px; }
      #pad { width: min(84vw, 50vh, 380px); aspect-ratio: 1; border-radius: 26px; background: #18224a; border: 4px dashed #9aa6d6; position: relative; touch-action: none; }
      #pad .knob { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; left: 50%; top: 50%; border-radius: 50%; background: #ff8a3d; border: 4px solid #0a0f22; pointer-events: none; }
      #pad .label { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #9aa6d6; font-size: 15px; font-weight: 700; pointer-events: none; }
      #meter { position: relative; flex: none; width: min(80vw, 340px); height: 22px; border-radius: 11px; background: #0a0f22; border: 3px solid #0a0f22; overflow: hidden; }
      #meter .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: #2ad1c9; }
      #meter .peak { position: absolute; top: 0; bottom: 0; width: 4px; background: #eef2ff; left: 0; }
      #meter .thr { position: absolute; top: -3px; bottom: -3px; width: 4px; background: #ffd23f; }
      #meter.hit .fill { background: #b6f04a; }
      #swing { height: 30px; font-weight: 800; font-size: 22px; color: #ffd23f; text-align: center; }
      .menupad { flex: 1; min-height: 0; display: flex; flex-direction: column; gap: 12px; justify-content: flex-end; }
      .picks { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
      .picks button { background: #22306a; color: #eef2ff; font-size: 18px; min-height: 58px; padding: 8px 10px; text-align: left; display: flex; align-items: center; gap: 8px; }
      .picks .medal { width: 16px; height: 16px; border-radius: 50%; border: 3px solid #0a0f22; flex: none; background: #18224a; }
      .choices { display: grid; gap: 10px; }
      .choices h2 { margin: 0 0 2px; font-size: 30px; }
      .choices button { background: #22306a; color: #eef2ff; font-size: 22px; min-height: 60px; }
      .choices button.sel { background: #ff8a3d; color: #0a0f22; }
      .dpad { display: grid; grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, min(76px, 9vh)); gap: 10px; width: min(100%, 340px); margin: 0 auto; }
      .dpad button { font-size: 30px; padding: 0; background: #2ad1c9; }
      .dpad .up { grid-area: 1 / 2; } .dpad .left { grid-area: 2 / 1; } .dpad .ok { grid-area: 2 / 2; background: #ff8a3d; font-size: 24px; }
      .dpad .right { grid-area: 2 / 3; } .dpad .down { grid-area: 3 / 2; }
      .back { background: #9aa6d6; }
      .pause { background: #9aa6d6; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <main id="main">
      <div class="bar"><span class="dot" id="me-dot"></span><span id="me-name"></span><span class="chip" id="state">Starting…</span></div>
      <div class="card" id="card"><h1 id="title">Motion Lab</h1><p class="hint" id="hint">Look at the screen.</p></div>
      <div class="stage" id="stage">
        <canvas id="level" width="340" height="340"></canvas>
        <div id="pad" hidden><div class="knob" id="knob"></div><div class="label">Touch pad: drag to tilt, flick to swing</div></div>
        <button id="big" hidden>FIRE</button>
        <div id="meter" hidden><div class="fill" id="meter-fill"></div><div class="peak" id="meter-peak"></div><div class="thr" id="meter-thr"></div></div>
        <div id="swing"></div>
      </div>
      <div class="menupad" id="menupad" hidden>
        <div class="choices" id="choices"></div>
        <div class="picks" id="picks"></div>
        <div class="dpad">
          <button data-nav="up" class="up" aria-label="Up">▲</button>
          <button data-nav="left" class="left" aria-label="Left">◀</button>
          <button data-nav="a" class="ok" id="ok">OK</button>
          <button data-nav="right" class="right" aria-label="Right">▶</button>
          <button data-nav="down" class="down" aria-label="Down">▼</button>
        </div>
        <div class="row"><button data-nav="b" class="back">Back</button></div>
      </div>
      <button id="take" hidden>Use this phone</button>
      <div class="row" id="playrow"><button data-nav="menu" class="pause" id="pause">Pause</button><button data-nav="b" class="back" id="benchback">Back</button><button id="center">Re-center</button></div>
    </main>
    <script>
      const $ = (id) => document.getElementById(id)
      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v))
      const round = (v, k = 10) => Math.round(v * k) / k
      const DEFAULT_BETA = 35
      const TOUCH_RANGE = 28

      // ==== phone motion =========================================================================
      /**
       * Reads the phone's motion sensors and turns them into what a game needs. Every sensor event
       * is used (60-200 a second, not one reading per network message), each with its own time, so
       * a swing's moment is known to the millisecond. It also:
       *   - takes readings from the join page (which iOS sends them to) or from this frame (which
       *     Android sends them to once it's tapped), whichever is fresh;
       *   - turns axes with the screen, so landscape doesn't rotate swipes;
       *   - learns the gyro's drift while the phone lies still and takes it off;
       *   - gives tilt as the direction of "up" (no gimbal flip near upright), gyro aiming as
       *     running totals (a lost message loses nothing), a live strength, and stillness;
       *   - hands every sample to onSample({ t, dt, a, w, up }) in screen axes (a in m/s², w in
       *     deg/s about x, y, z) for gestures of the game's own.
       * Live tuning comes from cfg() (the TV's controller.public.cfg), so nothing here is fixed.
       */
      function createPhoneMotion({ cfg, onSwing, onChange, onSample = () => {} }) {
        const pm = {
          state: 'waiting', // waiting | ask | on | touch:unsupported | touch:denied | touch:insecure
          ori: { b: DEFAULT_BETA, g: 0, a: undefined },
          up: null, // [x, y, z], screen axes: x right, y up the screen, z out of it
          gyro: { x: 0, y: 0, on: false },
          m: 0, // strength now (m/s², or the gyro's equivalent when the station counts turning)
          still: false,
          hz: 0,
          bias: 0, // deg/s of gyro drift being taken off
          angle: 0, // screen rotation, degrees
          last: -1e9 // performance.now() of the newest reading
        }
        const direct = { last: -1e9, ori: null }
        const bias = [0, 0, 0]
        const hist = []
        let lastT = -Infinity
        let stillFor = 0
        let restFor = 0
        let count = 0
        let countAt = performance.now()
        let grav = null
        let swing = null
        let cooldown = -Infinity
        const set = (st) => {
          if (pm.state === st) return
          pm.state = st
          onChange()
        }

        parent.postMessage({ type: 'motion', on: true }, '*')
        addEventListener('message', (e) => {
          if (e.source !== parent || e.data?.type !== 'motion') return
          const d = e.data
          if (d.state) set(d.state === 'on' || d.state === 'ask' || d.state === 'waiting' ? d.state : 'touch:' + d.state)
          if (performance.now() - direct.last < 150) return // this frame hears the sensors itself
          const at = performance.now()
          if (Array.isArray(d.s) && d.s.length) for (const s of d.s) sample(at - (s.age || 0), s.a, s.g, s.w, s.o)
          else if (d.r) sample(at, [d.r.x, d.r.y, d.r.z], null, null, [d.r.b, d.r.g, null]) // an older join page
        })
        // Android only sends sensor events to the focused frame: listen here too.
        addEventListener('deviceorientation', (e) => {
          if (typeof e.beta !== 'number') return
          direct.ori = [e.beta, e.gamma ?? 0, typeof e.alpha === 'number' ? e.alpha : null]
        })
        const vec = (v, ...k) => (v && typeof v[k[0]] === 'number' ? k.map((n) => v[n]) : null)
        addEventListener('devicemotion', (e) => {
          const a = vec(e.acceleration, 'x', 'y', 'z')
          const g = vec(e.accelerationIncludingGravity, 'x', 'y', 'z')
          const w = vec(e.rotationRate, 'alpha', 'beta', 'gamma')
          if (!a && !g && !w) return
          direct.last = performance.now()
          sample(e.timeStamp || direct.last, a, g, w, direct.ori)
        })
        try {
          screen.orientation?.lock?.('portrait').catch(() => {})
        } catch {}

        /** Device x/y → screen x/y: the phone turned to landscape turns its axes with it. */
        function toScreen(x, y) {
          const r = (pm.angle * Math.PI) / 180
          const c = Math.cos(r)
          const s = Math.sin(r)
          return [x * c - y * s, x * s + y * c]
        }

        function sample(t, a, g, w, o) {
          if (t <= lastT - 1) return // already seen (both sources overlapping)
          const dt = clamp((t - (lastT > -Infinity ? lastT : t - 16)) / 1000, 0.001, 0.05)
          lastT = t
          pm.last = performance.now()
          if (pm.state !== 'on' && !pm.state.startsWith('touch')) set('on')
          if (pm.state.startsWith('touch')) return
          count++
          if (pm.last - countAt >= 1000) {
            pm.hz = Math.round((count * 1000) / (pm.last - countAt))
            count = 0
            countAt = pm.last
          }
          pm.angle = screen.orientation?.angle ?? (typeof window.orientation === 'number' ? window.orientation : 0)
          if (o) pm.ori = { b: o[0], g: o[1], a: typeof o[2] === 'number' ? o[2] : undefined }
          // Movement without gravity. Some phones only give it with gravity: take a slow average off.
          if (!a && g) {
            grav = grav ? grav.map((v, i) => v + (g[i] - v) * 0.08) : [...g]
            a = g.map((v, i) => v - grav[i])
          }
          a ??= [0, 0, 0]
          // Up, from the phone's own (sensor-fused) orientation, in screen axes.
          const rb = (pm.ori.b * Math.PI) / 180
          const rg = (pm.ori.g * Math.PI) / 180
          const [ux, uy] = toScreen(-Math.sin(rg) * Math.cos(rb), Math.sin(rb))
          pm.up = [ux, uy, Math.cos(rg) * Math.cos(rb)]
          const [ax, ay] = toScreen(a[0], a[1])
          const az = a[2]
          const am = Math.hypot(ax, ay, az)
          // Directions in the room, not the phone: up is toward the ceiling (along "up"), right is
          // the screen's right edge levelled. So a flick up reads as up whether the phone is held
          // upright or flat like a remote (where the phone's own y axis points forward).
          const [qx, qy, qz] = pm.up
          const rx = 1 - qx * qx
          const ry = -qx * qy
          const rz = -qx * qz
          const rl = Math.hypot(rx, ry, rz) || 1
          const dx = (ax * rx + ay * ry + az * rz) / rl
          const dy = ax * qx + ay * qy + az * qz

          // Gyro: rotation about the phone's z (alpha), x (beta) and y (gamma), in deg/s.
          let wx = 0
          let wy = 0
          let wz = 0
          let wm = 0
          if (w) {
            const raw = Math.hypot(w[0] - bias[0], w[1] - bias[1], w[2] - bias[2])
            // Lying still: what the gyro reads is drift. Learn it slowly and take it off.
            stillFor = raw < 4 && am < 0.35 ? stillFor + dt : 0
            // Drift is only learned when the phone is truly at rest (on a table, not in a hand
            // aiming slowly), slowly, and never more than a real gyro drifts: otherwise a steady
            // aim gets "corrected" away.
            restFor = Math.hypot(...w) < 1.5 && am < 0.15 ? restFor + dt : 0
            if (restFor > 1.5) for (let i = 0; i < 3; i++) bias[i] = clamp(bias[i] + (w[i] - bias[i]) * Math.min(1, dt * 0.3), -1.5, 1.5)
            pm.bias = round(Math.hypot(...bias))
            wz = w[0] - bias[0]
            ;[wx, wy] = toScreen(w[1] - bias[1], w[2] - bias[2])
            wm = Math.hypot(wx, wy, wz)
            gyroAim(wx, wy, wz, dt)
          } else stillFor = am < 0.35 ? stillFor + dt : 0
          pm.still = stillFor > 0.25
          const c = cfg()
          pm.m = Math.max(am, wm * (c.gk ?? 0))
          detect(t, pm.m, ax, ay, az, dx, dy, wm, c)
          onSample({ t, dt, a: [ax, ay, az], w: [wx, wy, wz], up: pm.up })
        }

        /**
         * Gyro aiming, the way Steam Input and JoyShockMapper do it: turning speed moves the sight
         * like a mouse. Left/right is turning around the real vertical, so it works however the
         * phone is held; up/down is tipping the top. Tremor is tightened toward zero, slow moves
         * are smoothed and fast ones go straight through.
         */
        function gyroAim(wx, wy, wz, dt) {
          const c = cfg()
          const [ux, uy, uz] = pm.up
          let yaw = wx * ux + wy * uy + wz * uz // turning left is positive
          let pitch = wx // tipping the top up is positive
          const speed = Math.hypot(yaw, pitch)
          const tighten = c.tighten ?? 1.5
          if (speed < tighten && speed > 0) {
            yaw *= speed / tighten
            pitch *= speed / tighten
          }
          hist.push([yaw, pitch])
          if (hist.length > 4) hist.shift()
          const avg = hist.reduce((s, v) => [s[0] + v[0] / hist.length, s[1] + v[1] / hist.length], [0, 0])
          const k = clamp((speed - (c.smoothLo ?? 4)) / ((c.smoothHi ?? 12) - (c.smoothLo ?? 4)), 0, 1)
          pm.gyro.x -= (yaw * k + avg[0] * (1 - k)) * dt
          pm.gyro.y -= (pitch * k + avg[1] * (1 - k)) * dt
          pm.gyro.on = true
        }

        /**
         * A swing starts when the strength passes the threshold. 'peak' swings (flicks, shakes) end
         * when it fades and are timed at their strongest moment. 'flip' swings (a bat) are timed
         * where the push turns into the stop, the fastest moment of the swing, which is when the
         * acceleration reverses, or for a mostly turning swing when the turning peaks. The readings
         * that push the same way as the first one give the direction.
         */
        function detect(t, m, ax, ay, az, dx, dy, wm, c) {
          const thr = c.thr ?? 12
          if (!swing) {
            if (m >= thr && t > cooldown) swing = { t0: t, m, peakT: t, fx: ax, fy: ay, fz: az, px: dx, py: dy, sx: dx, sy: dy, k: 1, wPeak: wm, wPeakT: t, flipT: 0 }
            return
          }
          const s = swing
          if (m > s.m) {
            s.m = m
            s.peakT = t
          }
          if (wm > s.wPeak) {
            s.wPeak = wm
            s.wPeakT = t
          }
          if (dx * s.px + dy * s.py > 0) {
            s.sx += dx
            s.sy += dy
            s.k++
          }
          const flip = c.at === 'flip'
          const pushed = Math.hypot(s.fx, s.fy, s.fz) > thr * 0.5
          if (flip && !s.flipT) {
            if (pushed && ax * s.fx + ay * s.fy + az * s.fz < 0) s.flipT = t
            else if (!pushed && s.wPeak > 0 && wm < s.wPeak * 0.6) s.flipT = s.wPeakT
          }
          const dur = t - s.t0
          const done = flip ? s.flipT || dur >= (c.winMs ?? 260) : (m < thr * 0.5 && dur >= 8) || dur >= (c.peakMs ?? 110)
          if (!done) return
          swing = null
          cooldown = t + (c.cd ?? 200)
          const sign = c.inv ? -1 : 1
          // The average push (not the sum, which would grow with the sensor rate).
          const ex = (s.sx / s.k) * sign
          const ey = (s.sy / s.k) * sign
          let dir = null
          if (Math.max(Math.abs(ex), Math.abs(ey)) > (c.dz ?? 2)) dir = Math.abs(ex) > Math.abs(ey) ? (ex > 0 ? 'right' : 'left') : ey > 0 ? 'up' : 'down'
          const full = c.full ?? 32
          const at = flip ? s.flipT || s.wPeakT : s.peakT
          onSwing({ dir, p: clamp((s.m - thr) / (full - thr), 0.15, 1), m: s.m, pt: at, raw: { x: round(s.px), y: round(s.py), z: round(s.fz), w: Math.round(s.wPeak) } })
        }
        return pm
      }
      // ==== end phone motion =====================================================================

      let fire = false
      let swingText = ''
      let swingTimer = 0
      let touchTilt = null // the touch pad's pretend tilt
      let peakShown = 0

      const pm = createPhoneMotion({
        cfg: () => controller.public.cfg ?? {},
        onSwing: (s) => swingOut(s.dir, s.p, s.m, s.pt, s.raw),
        onChange: () => (render(), send()),
        onSample: () => send() // controller.input only sends changes, at most 30 a second
      })

      function swingOut(dir, p, m, pt, raw) {
        controller.send({ swing: { dir, p: round(p, 100), m: round(m), pt: round(pt), age: Math.round(performance.now() - pt), raw } })
        controller.vibrate(dir ? 18 : 12)
        peakShown = Math.max(peakShown, m)
        const arrows = { left: '←', right: '→', up: '↑', down: '↓' }
        swingText = `${arrows[dir] ?? '●'} swing ${Math.round(p * 100)}%`
        $('meter').classList.add('hit')
        clearTimeout(swingTimer)
        swingTimer = setTimeout(() => ((swingText = ''), $('meter').classList.remove('hit'), render()), 600)
        render()
      }

      function send() {
        const st = pm.state.startsWith('touch') ? 'touch' : pm.state
        const tilt = touchTilt ?? pm.ori
        const u = !touchTilt && pm.up ? { u: pm.up.map((v) => round(v, 1000)) } : {}
        controller.input({
          tb: round(tilt.b),
          tg: round(tilt.g),
          ...(typeof tilt.a === 'number' ? { ta: round(tilt.a) } : {}),
          ...u,
          ...(pm.gyro.on ? { gx: round(pm.gyro.x, 100), gy: round(pm.gyro.y, 100) } : {}),
          m: round(pm.m),
          f: fire,
          st,
          ...(st === 'touch' ? { why: pm.state.slice(6) } : {}),
          still: st !== 'on' || pm.still,
          ph: { hz: pm.hz, o: pm.angle, bias: pm.bias }
        })
      }

      // ---- touch pad when there are no motion sensors ----
      const pad = $('pad')
      let drag = null
      pad.addEventListener('pointerdown', (e) => {
        pad.setPointerCapture(e.pointerId)
        drag = { id: e.pointerId, x: e.clientX, y: e.clientY, t: performance.now(), done: false }
        padMove(e)
      })
      pad.addEventListener('pointermove', (e) => drag?.id === e.pointerId && padMove(e))
      const padUp = (e) => {
        if (drag?.id !== e.pointerId) return
        drag = null
        touchTilt = { b: DEFAULT_BETA, g: 0 }
        $('knob').style.left = '50%'
        $('knob').style.top = '50%'
        send()
      }
      pad.addEventListener('pointerup', padUp)
      pad.addEventListener('pointercancel', padUp)
      function padMove(e) {
        const r = pad.getBoundingClientRect()
        const nx = clamp(((e.clientX - r.left) / r.width) * 2 - 1, -1, 1)
        const ny = clamp(((e.clientY - r.top) / r.height) * 2 - 1, -1, 1)
        $('knob').style.left = `${(nx + 1) * 50}%`
        $('knob').style.top = `${(ny + 1) * 50}%`
        touchTilt = { b: DEFAULT_BETA + ny * TOUCH_RANGE, g: nx * TOUCH_RANGE }
        const dx = e.clientX - drag.x
        const dy = e.clientY - drag.y
        const dt = performance.now() - drag.t
        if (!drag.done && Math.hypot(dx, dy) > r.width * 0.22 && dt < 260) {
          drag.done = true
          const dir = Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : dy > 0 ? 'down' : 'up'
          swingOut(dir, clamp(1 - dt / 300, 0.3, 1), 0, performance.now())
        }
        send()
      }

      // ---- buttons ----
      const big = $('big')
      const press = (down) => (e) => {
        e.preventDefault()
        if (fire === down) return
        fire = down
        big.classList.toggle('down', down)
        if (down) controller.vibrate(12)
        send()
      }
      big.addEventListener('pointerdown', press(true))
      big.addEventListener('pointerup', press(false))
      big.addEventListener('pointercancel', press(false))
      big.addEventListener('pointerleave', press(false))
      for (const b of [$('center'), $('take')]) b.addEventListener('pointerdown', (e) => e.preventDefault())
      // Menu buttons: the TV treats them like its own D-pad, A, B and Start.
      for (const b of document.querySelectorAll('[data-nav]')) {
        b.addEventListener('pointerdown', (e) => {
          e.preventDefault()
          controller.send({ nav: b.dataset.nav })
          controller.vibrate(10)
        })
      }
      const MEDALS = ['#18224a', '#d98b4a', '#c9d3ea', '#ffd23f']
      let picksKey = ''
      let choicesKey = ''
      function renderChoices(menu) {
        const key = JSON.stringify(menu ?? null)
        if (key === choicesKey) return
        choicesKey = key
        const h = document.createElement('h2')
        h.textContent = menu?.heading ?? ''
        $('choices').replaceChildren(
          ...(menu ? [h] : []),
          ...(menu?.items ?? []).map((it) => {
            const b = document.createElement('button')
            b.textContent = it.label
            if (it.id === menu.sel) b.className = 'sel'
            b.addEventListener('pointerdown', (e) => {
              e.preventDefault()
              controller.send({ choose: it.id })
              controller.vibrate(15)
            })
            return b
          })
        )
      }
      function renderPicks(picks) {
        const key = JSON.stringify(picks ?? null)
        if (key === picksKey) return
        picksKey = key
        $('picks').replaceChildren(
          ...(picks ?? []).map((p) => {
            const b = document.createElement('button')
            const dot = document.createElement('span')
            dot.className = 'medal'
            dot.style.background = MEDALS[p.medal] ?? MEDALS[0]
            b.append(dot, p.name)
            b.addEventListener('pointerdown', (e) => {
              e.preventDefault()
              controller.send({ pick: p.id })
              controller.vibrate(15)
            })
            return b
          })
        )
      }
      $('center').onclick = () => {
        controller.send({ center: true })
        controller.vibrate(20)
      }
      $('take').onclick = () => {
        controller.send({ take: true })
        controller.vibrate(30)
      }

      // The TV's clock check: answer with this phone's clock, so it can line swing times up with its own.
      controller.on('msg', (d) => {
        if (d?.ping) controller.send({ pong: d.ping, pt: round(performance.now()) })
        if (d?.buzz) controller.vibrate(d.buzz)
      })

      // ---- drawing ----
      const STATES = {
        on: ['Motion on', 'on'],
        ask: ['Tap "Allow motion" below', 'warn'],
        waiting: ['Starting sensors…', 'warn'],
        stalled: ['Motion paused: tap the screen', 'warn'],
        'touch:unsupported': ['No sensors: touch pad', 'bad'],
        'touch:denied': ['Motion blocked: touch pad', 'bad'],
        'touch:insecure': ['Motion needs https: touch pad', 'bad']
      }
      // No readings for a while (Android stops sending them to an unfocused frame): say so.
      const stalled = () => pm.state === 'on' && performance.now() - pm.last > 500
      function render() {
        const { public: pub, mine, me } = controller
        $('me-dot').style.background = me.color
        $('me-name').textContent = me.name || 'Phone'
        const st = stalled() ? 'stalled' : pm.state
        const [label, cls] = STATES[st] ?? [st, '']
        $('state').textContent = label
        $('state').className = `chip ${cls}`
        $('main').className = pm.state === 'ask' ? 'ask' : ''
        const standby = mine.role === 'standby'
        $('title').textContent = standby ? 'Another phone is in control' : pub.title ?? 'Motion Lab'
        $('hint').textContent = standby ? 'Tap below to use this phone instead.' : pub.hint ?? 'Look at the screen.'
        $('take').hidden = !standby
        const touch = pm.state.startsWith('touch')
        pad.hidden = !touch || standby
        // With a big button there's no room for the level; the TV shows where you're aiming.
        $('level').hidden = touch || standby || Boolean(pub.btn)
        big.hidden = !pub.btn || standby
        big.textContent = pub.btn ?? ''
        const menu = !standby && (pub.mode ?? 'menu') === 'menu'
        $('menupad').hidden = !menu
        $('stage').hidden = menu || standby
        renderPicks(menu ? pub.picks : null)
        renderChoices(menu ? pub.menu : null)
        // Menus with their own buttons don't need the pad.
        document.querySelector('.dpad').hidden = Boolean(menu && pub.menu)
        document.querySelector('.menupad > .row').hidden = Boolean(menu && pub.menu)
        // The station list says it all on the hub; the card would only crowd it.
        $('card').hidden = Boolean(menu && (pub.picks || pub.menu))
        $('playrow').hidden = standby || menu
        $('pause').hidden = pub.mode !== 'play'
        $('benchback').hidden = pub.mode !== 'bench'
        if (menu) $('hint').textContent = pub.picks ? 'Tap a station, or use the pad.' : 'Use the pad to work the menu on the screen.'
        if (pub.paused && !standby) $('title').textContent = 'Paused'
        $('swing').textContent = swingText
        $('meter').hidden = touch || standby || menu
      }

      // The swing meter: how hard the phone is moving now, the last swing's peak, and the threshold.
      function drawMeter() {
        if ($('meter').hidden) return
        const c = controller.public.cfg ?? {}
        const full = (c.full ?? 32) * 1.15
        peakShown = Math.max(0, peakShown - 0.25)
        $('meter-fill').style.width = `${clamp(pm.m / full, 0, 1) * 100}%`
        $('meter-peak').style.left = `${clamp(peakShown / full, 0, 1) * 100}%`
        $('meter-thr').style.left = `${clamp((c.thr ?? 12) / full, 0, 1) * 100}%`
      }

      // A bubble level: where the TV thinks "centre" is, and where the phone is now.
      const lv = $('level').getContext('2d')
      let wasStalled = false
      function drawLevel() {
        requestAnimationFrame(drawLevel)
        if (stalled() !== wasStalled) ((wasStalled = !wasStalled), render())
        drawMeter()
        if ($('level').hidden) return
        const n = controller.mine.n ?? { b: DEFAULT_BETA, g: 0 }
        const s = 340
        lv.clearRect(0, 0, s, s)
        lv.fillStyle = '#18224a'
        lv.strokeStyle = '#0a0f22'
        lv.lineWidth = 8
        lv.beginPath()
        lv.arc(s / 2, s / 2, s / 2 - 6, 0, Math.PI * 2)
        lv.fill()
        lv.stroke()
        lv.strokeStyle = '#2ad1c9'
        lv.lineWidth = 4
        lv.beginPath()
        lv.arc(s / 2, s / 2, 40, 0, Math.PI * 2)
        lv.moveTo(s / 2 - 120, s / 2)
        lv.lineTo(s / 2 + 120, s / 2)
        lv.moveTo(s / 2, s / 2 - 120)
        lv.lineTo(s / 2, s / 2 + 120)
        lv.stroke()
        const x = clamp((pm.ori.g - n.g) / 30, -1, 1) * 120
        const y = clamp((pm.ori.b - n.b) / 30, -1, 1) * 120
        lv.fillStyle = '#ff8a3d'
        lv.beginPath()
        lv.arc(s / 2 + x, s / 2 + y, 30, 0, Math.PI * 2)
        lv.fill()
        lv.lineWidth = 6
        lv.strokeStyle = '#0a0f22'
        lv.stroke()
      }

      controller.on('update', render)
      render()
      drawLevel()
      send()
    </script>
  </body>
</html>
