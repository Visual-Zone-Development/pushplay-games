# Builds every game that changed (on any branch) and publishes it to the
# "pushplay-latest" release, where the PushPlay launcher picks it up.
name: Build games

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md', 'docs/**']
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every game
        type: boolean
        default: true

permissions:
  contents: write # publish builds to the release

# Builds share one release index, so they run one at a time (newest push wins).
concurrency:
  group: publish-games
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to see which games changed

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      # `npm ci` needs an up-to-date lockfile; fall back so a forgotten `npm install` doesn't block builds.
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - run: npx playwright install --with-deps chromium

      - run: node tools/ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_ALL: ${{ inputs.all }}
