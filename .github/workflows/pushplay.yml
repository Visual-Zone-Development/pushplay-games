# Builds this repo's games on every push and checks them; on the default branch it publishes
# them to the "pushplay-latest" release, where the PushPlay launcher picks them up (a branch named
# "beta" publishes to "pushplay-beta"). The build itself is PushPlay's, shared by every
# game repo, so there is nothing else to keep up to date here.
#
# Your own release workflow is not affected: this one has its own file and its own releases.
# To hand it files your own build makes, see https://github.com/Visual-Zone-Development/pushplay-kit/blob/main/docs/pushplay-build.md
name: PushPlay

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  release:
    types: [published] # a game with "release" in its manifest is packaged from your release's own files
  workflow_dispatch:

jobs:
  pushplay:
    uses: Visual-Zone-Development/pushplay-kit/.github/workflows/build.yml@v1
    permissions:
      contents: write # publish the builds to this repo's releases
      id-token: write # online games: prove which repo built them
