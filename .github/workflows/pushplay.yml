# Builds every game that changed (on any branch) and publishes it to the
# "pushplay-latest" release, where the PushPlay launcher picks it up.
# Installed by the PushPlay build kit (.github/pushplay/). Re-run setup to update it.
name: Build games

on:
  push:
    branches: ['**']
    paths-ignore: ['**/*.md']
  workflow_dispatch:
    inputs:
      all:
        description: Rebuild every game
        type: boolean
        default: true

permissions:
  contents: write # publish builds to the release
  id-token: write # online games: prove which repo built them, to get a pass for the online relay

# Builds share one release index, so they run one at a time.
concurrency:
  group: pushplay-publish
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # needed to see which games changed

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # The game's own dependencies, if it has any. `npm ci` needs an up-to-date lockfile,
      # so fall back to `npm install` rather than block the build.
      - name: Install game dependencies
        run: |
          if [ -f package.json ]; then
            npm ci --no-audit --no-fund || npm install --no-audit --no-fund
          fi

      # The build kit's own dependencies live inside .github/pushplay, separate from the game's.
      - name: Install build kit
        run: npm install --prefix .github/pushplay --no-audit --no-fund --no-package-lock

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1

      - name: Install headless browser
        run: node .github/pushplay/node_modules/playwright/cli.js install --with-deps chromium

      - name: Build, check and publish
        run: node .github/pushplay/ci.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          BUILD_ALL: ${{ inputs.all }}
